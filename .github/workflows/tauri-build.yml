name: Build desktop app

# Builds native Squoosh installers for Windows and macOS.
# macOS binaries cannot be cross-compiled from Windows/Linux, so each
# platform is built on its own native runner.
#
# Push a tag like `v1.0.0` to produce a draft GitHub Release with the
# installers attached, or run manually via "Run workflow".

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal binary covering Apple Silicon + Intel Macs.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action runs the frontend build (beforeBuildCommand) and
      # packages the app. On a tag push it uploads the installers to a
      # draft release.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Squoosh __VERSION__'
          releaseBody: 'Native Squoosh desktop builds.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
